    ReportPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            columns: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string }, type: { type: string, enum: [text, qty, money, date] } } } }
            totals: { type: object }
