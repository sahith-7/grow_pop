        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: paymentState, in: query, schema: { $ref: '#/components/schemas/PaymentState' } }
        - { name: q, in: query, description: 'Order no., Woo id, customer phone', schema: { type: string } }
