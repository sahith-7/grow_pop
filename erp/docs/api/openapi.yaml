        - { name: stage, in: query, schema: { type: string, enum: [ready_to_pick, picking, packed, dispatched_pending_web, stock_exception] } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } } } }
        default: { $ref: '#/components/responses/Error' }
  /pick-lists:
    post:
      operationId: postPickLists
      tags: [Fulfilment]
      summary: Create a pick list for one or more ready orders (orders move to picking)
      x-permission: order.fulfil
      x-stage: B6
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [orderIds], properties: { orderIds: { type: array, minItems: 1, maxItems: 30, items: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PickList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /pick-lists/{id}:
    get:
      operationId: getPickListsById
      tags: [Fulfilment]
      summary: Pick list sorted by location then SKU
      x-permission: order.fulfil
      x-stage: B6
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PickList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /pick-lists/{id}/scan:
    post:
      operationId: postPickListsScan
      tags: [Fulfilment]
      summary: Record a picked item by scanned code; wrong item or over-pick → 409 PICK_MISMATCH
      x-permission: order.fulfil
      x-stage: B6
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string }, qty: { $ref: '#/components/schemas/Qty' } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PickList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/pack:
    post:
      operationId: postOrdersPack
      tags: [Fulfilment]
      summary: Confirm packed quantities (must equal reserved; substitutions disabled in V1)
      x-permission: order.fulfil
      x-stage: B6
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [lines], properties: { lines: { type: array, items: { type: object, required: [lineId, qty], properties: { lineId: { type: string, format: uuid }, qty: { $ref: '#/components/schemas/Qty' } } } } } } } }
      responses:
        '200': { description: Packed, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/dispatch:
    post:
      operationId: postOrdersDispatch
      tags: [Fulfilment]
      summary: Dispatch; converts reservations to deductions exactly once and queues the Woo update (AC-10)
      x-permission: order.fulfil
      x-stage: B6
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier, trackingNo]
              properties:
                carrier: { type: string, maxLength: 60 }
                service: { type: string, maxLength: 60 }
                trackingNo: { type: string, maxLength: 60 }
                shippedAt: { type: string, format: date-time }
      responses:
        '200': { description: Dispatched, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- WooCommerce
  /integrations/woocommerce:
    get:
      operationId: getIntegrationsWoocommerce
      tags: [WooCommerce]
      summary: Connection status (never returns secrets)
      x-permission: sync.manage
      x-stage: B4
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WooConnection' } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putIntegrationsWoocommerce
      tags: [WooCommerce]
      summary: Connect or replace credentials (TEN-04); registers webhooks on success
      x-permission: woo.connect
      x-stage: B4
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WooConnectInput' } } } }
      responses:
        '200': { description: Connected, content: { application/json: { schema: { $ref: '#/components/schemas/WooConnection' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteIntegrationsWoocommerce
      tags: [WooCommerce]
      summary: Disconnect; deletes our webhooks in Woo and stored secrets; mappings kept for reconnect
      x-permission: woo.connect
      x-stage: B4
      responses:
        '204': { description: Disconnected }
        default: { $ref: '#/components/responses/Error' }
  /integrations/woocommerce/test:
    post:
      operationId: postIntegrationsWoocommerceTest
      tags: [WooCommerce]
      summary: Test credentials without saving (TEN-05); SSRF-guarded server-side request
      x-permission: woo.connect
      x-stage: B4
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WooConnectInput' } } } }
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  wooVersion: { type: string }
                  currency: { type: string }
                  canManageWebhooks: { type: boolean }
                  problem: { type: string, enum: [dns, tls, unreachable, unauthorized, not_woocommerce, permissions, private_address] }
        default: { $ref: '#/components/responses/Error' }
  /integrations/woocommerce/match:
    get:
      operationId: getIntegrationsWoocommerceMatch
      tags: [WooCommerce]
      summary: Initial SKU match between ERP and Woo products (matched / erp_only / woo_only)
      x-permission: sync.manage
      x-stage: B4
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { matched: { type: integer }, erpOnly: { type: integer }, wooOnly: { type: array, items: { type: object, properties: { wooProductId: { type: integer }, sku: { type: string }, name: { type: string } } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}/publish:
    post:
      operationId: postProductsPublish
      tags: [WooCommerce]
      summary: Queue product + images for publishing (CAT-07/08)
      x-permission: sync.manage
      x-stage: B4
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        default: { $ref: '#/components/responses/Error' }
  /sync/jobs:
    get:
      operationId: getSyncJobs
      tags: [WooCommerce]
      summary: Sync jobs for diagnostics; errors are redacted summaries
      x-permission: sync.manage
      x-stage: B4
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, running, failed, dead, done] } }
        - { name: kind, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SyncJob' } } } }
        default: { $ref: '#/components/responses/Error' }
  /sync/jobs/{id}/retry:
    post:
      operationId: postSyncJobsRetry
      tags: [WooCommerce]
      summary: Manual retry of a failed/dead job (audited)
      x-permission: sync.manage
      x-stage: B4
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Requeued, content: { application/json: { schema: { $ref: '#/components/schemas/SyncJob' } } } }
        default: { $ref: '#/components/responses/Error' }
  /sync/reconcile:
    post:
      operationId: postSyncReconcile
      tags: [WooCommerce]
      summary: Run reconciliation now; at most one running per tenant (AC-12)
      x-permission: sync.manage
      x-stage: B4
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/SyncJob' } } } }
        default: { $ref: '#/components/responses/Error' }
  /webhooks/woocommerce/{endpointToken}:
    post:
      operationId: postWebhooksWoocommerce
      tags: [WooCommerce]
      summary: Inbound Woo webhook (public). HMAC-SHA256 of the raw body in X-WC-Webhook-Signature.
      description: |
        No session, no Origin check. Rate-limited per token. Invalid signature → 401 and a security
        audit event. Valid → inbox insert and 200 within 1 s; duplicates also return 200.
        Woo's ping on webhook creation (form-encoded webhook_id) returns 200.
      security: []
      x-permission: (HMAC)
      x-stage: B4
      parameters:
        - { name: endpointToken, in: path, required: true, schema: { type: string, minLength: 43, maxLength: 43 } }
        - { name: X-WC-Webhook-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-WC-Webhook-Topic, in: header, required: true, schema: { type: string } }
        - { name: X-WC-Webhook-Delivery-ID, in: header, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Accepted or duplicate }
        '401': { $ref: '#/components/responses/Error' }
        '404': { description: Unknown token (no body) }

  # ---------------------------------------------------------------- Reports
  /reports/{report}:
    get:
      operationId: getReport
      tags: [Reports]
      summary: Report data (PRD 8). format=csv requires report.export; valuation columns require cost.view.
      x-permission: report.view
      x-stage: B6
      parameters:
        - { name: report, in: path, required: true, schema: { type: string, enum: [inventory-summary, low-stock, stock-movements, stocktake-variance, purchasing, sales, sync-health] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: locationId, in: query, schema: { type: string, format: uuid } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: Rows, content: { application/json: { schema: { $ref: '#/components/schemas/ReportPage' } }, text/csv: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Opaque session token set by Phase 1 /auth/login. HttpOnly, Secure, SameSite=Lax.

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Cursor: { name: cursor, in: query, description: Opaque cursor from nextCursor, schema: { type: string } }
    IncludeArchived: { name: includeArchived, in: query, schema: { type: boolean, default: false } }
    IdempotencyKey: { name: Idempotency-Key, in: header, description: 'UUID; same key + same body within 24 h returns the original result', schema: { type: string, format: uuid } }
    IdempotencyKeyRequired: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, description: 'Version from the last read (ETag); 412 VERSION_CONFLICT if stale', schema: { type: string } }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message, correlationId, retryable]
      properties:
        code:
          type: string
          description: Machine-readable. Full list in conventions.md.
          examples: [VALIDATION_ERROR, SKU_DUPLICATE, INSUFFICIENT_STOCK, NOT_FOUND, FORBIDDEN]
        message: { type: string, description: 'Human-readable, safe to show; never contains secrets or SQL' }
        fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        correlationId: { type: string }
        retryable: { type: boolean }
    Money: { type: string, pattern: '^-?\d{1,12}(\.\d{1,4})?$', example: '1299.00' }
    Qty: { type: string, pattern: '^-?\d{1,11}(\.\d{1,3})?$', example: '2' }
    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, 'null'] }
    RefItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        archivedAt: { type: [string, 'null'], format: date-time }
    RefItemInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        parentId: { type: [string, 'null'], format: uuid }
        archived: { type: boolean }
    Unit:
      type: object
      required: [name, abbr]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        abbr: { type: string, maxLength: 10 }
        allowFraction: { type: boolean, default: false }
    File:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, ready, rejected] }
        rejectReason: { type: string }
    PublishState: { type: string, enum: [not_published, queued, synced, failed, needs_review] }
    ProductSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, active, archived] }
        category: { type: [string, 'null'] }
        variantCount: { type: integer }
        skus: { type: array, items: { type: string }, maxItems: 3 }
        priceRange: { type: object, properties: { min: { $ref: '#/components/schemas/Money' }, max: { $ref: '#/components/schemas/Money' } } }
        available: { $ref: '#/components/schemas/Qty' }
        thumbnailUrl: { type: [string, 'null'], format: uri }
        publishState: { $ref: '#/components/schemas/PublishState' }
    ProductInput:
      type: object
      required: [name, type, variants]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        categoryId: { type: [string, 'null'], format: uuid }
        brandId: { type: [string, 'null'], format: uuid }
        unitId: { type: string, format: uuid }
        type: { type: string, enum: [simple, variable] }
        status: { type: string, enum: [draft, active], default: draft }
        hsnCode: { type: string, pattern: '^\d{4,8}$' }
        gstRate: { type: string, example: '18' }
        tracking: { type: string, enum: [none, batch, serial], default: none }
        publishToWeb: { type: boolean, default: false }
        attributes: { type: array, items: { type: object, properties: { name: { type: string }, values: { type: array, items: { type: string } } } } }
        variants: { type: array, minItems: 1, maxItems: 200, items: { $ref: '#/components/schemas/VariantInput' } }
    ProductPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        categoryId: { type: [string, 'null'], format: uuid }
        brandId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [draft, active] }
        hsnCode: { type: string }
        gstRate: { type: string }
        publishToWeb: { type: boolean }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            publishState: { $ref: '#/components/schemas/PublishState' }
            publishError: { type: [string, 'null'] }
            variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
            images: { type: array, items: { $ref: '#/components/schemas/Image' } }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    VariantInput:
      type: object
      required: [sku, price]
      properties:
        sku: { type: string, minLength: 1, maxLength: 64 }
        barcode: { type: [string, 'null'], pattern: '^[0-9A-Za-z\-]{4,64}$' }
        attributes: { type: object, additionalProperties: { type: string } }
        price: { $ref: '#/components/schemas/Money' }
        mrp: { $ref: '#/components/schemas/Money' }
        cost: { $ref: '#/components/schemas/Money', description: 'Requires cost.view; omitted from responses without it' }
        weightG: { type: integer }
        dimensionsMm: { type: object, properties: { l: { type: integer }, w: { type: integer }, h: { type: integer } } }
        reorderLevel: { $ref: '#/components/schemas/Qty' }
    Variant:
      allOf:
        - $ref: '#/components/schemas/VariantInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            status: { type: string, enum: [active, archived] }
            onHand: { $ref: '#/components/schemas/Qty' }
            available: { $ref: '#/components/schemas/Qty' }
            wooState: { $ref: '#/components/schemas/PublishState' }
    Image:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: '10-minute signed URL' }
        thumbnailUrl: { type: string, format: uri }
        variantId: { type: [string, 'null'], format: uuid }
        sortOrder: { type: integer }
        isPrimary: { type: boolean }
        altText: { type: string }
        syncState: { type: string, enum: [pending, synced, failed] }
        lastError: { type: [string, 'null'] }
    LookupResult:
      type: object
      properties:
        matchedOn: { type: string, enum: [barcode, sku] }
        productId: { type: string, format: uuid }
        variant: { $ref: '#/components/schemas/Variant' }
        productName: { type: string }
        gstRate: { type: string }
        available: { $ref: '#/components/schemas/Qty' }
    ImportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [products, opening_stock] }
        status: { type: string, enum: [uploaded, validating, validated, importing, done, failed] }
        totalRows: { type: integer }
        validRows: { type: integer }
        errorRows: { type: integer }
        errors: { type: array, maxItems: 50, items: { type: object, properties: { row: { type: integer }, column: { type: string }, message: { type: string } } } }
        errorReportUrl: { type: [string, 'null'], format: uri }
    ExportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, done, failed] }
        rowCount: { type: integer }
        downloadUrl: { type: [string, 'null'], format: uri }
    Location:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [shop_floor, back_room, quarantine] }
        isSellable: { type: boolean }
        isOnlineFulfilment: { type: boolean }
        active: { type: boolean }
    LocationInput:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        type: { type: string, enum: [shop_floor, back_room, quarantine] }
        isSellable: { type: boolean }
        active: { type: boolean }
    StockBalance:
      type: object
      properties:
        variantId: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        locationId: { type: string, format: uuid }
        onHand: { $ref: '#/components/schemas/Qty' }
        reserved: { $ref: '#/components/schemas/Qty' }
        available: { $ref: '#/components/schemas/Qty' }
        nonSellable: { $ref: '#/components/schemas/Qty' }
        reorderLevel: { $ref: '#/components/schemas/Qty' }
        value: { $ref: '#/components/schemas/Money', description: 'Only with cost.view' }
    MovementType: { type: string, enum: [opening, receipt, sale, dispatch, adjustment, writeoff, transfer_out, transfer_in, return_in, supplier_return, stocktake, reversal] }
    LedgerEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        postedAt: { type: string, format: date-time }
        variantId: { type: string, format: uuid }
        sku: { type: string }
        locationId: { type: string, format: uuid }
        bucket: { type: string, enum: [sellable, non_sellable] }
        qtyDelta: { $ref: '#/components/schemas/Qty' }
        balanceAfter: { $ref: '#/components/schemas/Qty' }
        movementType: { $ref: '#/components/schemas/MovementType' }
        source: { type: object, properties: { type: { type: string }, id: { type: string, format: uuid }, number: { type: string } } }
        reasonCode: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        actor: { type: object, properties: { id: { type: string }, name: { type: string } } }
    AdjustmentInput:
      type: object
      required: [locationId, reasonCode, lines]
      properties:
        locationId: { type: string, format: uuid }
        reasonCode: { type: string, enum: [damage, expiry, loss, correction, opening] }
        note: { type: string, maxLength: 500 }
        overrideNegative: { type: boolean, default: false }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: object, required: [variantId, qtyDelta], properties: { variantId: { type: string, format: uuid }, qtyDelta: { $ref: '#/components/schemas/Qty' }, bucket: { type: string, enum: [sellable, non_sellable], default: sellable } } }
    TransferInput:
      type: object
      required: [fromLocationId, toLocationId, lines]
      properties:
        fromLocationId: { type: string, format: uuid }
        toLocationId: { type: string, format: uuid }
        note: { type: string }
        lines: { type: array, minItems: 1, items: { type: object, required: [variantId, qty], properties: { variantId: { type: string, format: uuid }, qty: { $ref: '#/components/schemas/Qty' } } } }
    PostedDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        postedAt: { type: string, format: date-time }
        movements: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
    Stocktake:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { type: string, enum: [counting, review, posted, cancelled] }
        locationId: { type: string, format: uuid }
        blind: { type: boolean }
        snapshotAt: { type: string, format: date-time }
        progress: { type: object, properties: { counted: { type: integer }, total: { type: integer } } }
        lines:
          type: array
          items:
            type: object
            properties:
              variantId: { type: string, format: uuid }
              sku: { type: string }
              name: { type: string }
              expectedQty: { $ref: '#/components/schemas/Qty' }
              movedDuringCount: { $ref: '#/components/schemas/Qty' }
              countedQty: { $ref: '#/components/schemas/Qty' }
              variance: { $ref: '#/components/schemas/Qty' }
              varianceValue: { $ref: '#/components/schemas/Money', description: 'Only with cost.view' }
    Supplier:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 120 }
        phone: { type: string }
        email: { type: string, format: email }
        gstin: { type: string }
        stateCode: { type: string, pattern: '^\d{2}$' }
        address: { type: object }
        archived: { type: boolean }
    PoStatus: { type: string, enum: [draft, submitted, partial, closed, cancelled] }
