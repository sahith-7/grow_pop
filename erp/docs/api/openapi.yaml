      x-stage: B3
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, minLength: 3, maxLength: 500 } } } } }
      responses:
        '201': { description: Reversal posted, content: { application/json: { schema: { $ref: '#/components/schemas/PostedDocument' } } } }
        default: { $ref: '#/components/responses/Error' }

