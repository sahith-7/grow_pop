      operationId: getCustomers
      tags: [POS & sales]
      summary: Search customers by name or phone
      x-permission: order.read
      x-stage: B4
      parameters: [{ name: q, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Customer' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: postCustomers
      tags: [POS & sales]
      summary: Create customer at POS
      x-permission: pos.sell
      x-stage: B5
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        default: { $ref: '#/components/responses/Error' }
  /orders:
    get:
      operationId: getOrders
      tags: [POS & sales]
