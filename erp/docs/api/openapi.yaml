        lines: { type: array, minItems: 1, items: { type: object, required: [variantId, orderedQty, unitCost], properties: { variantId: { type: string, format: uuid }, orderedQty: { $ref: '#/components/schemas/Qty' }, unitCost: { $ref: '#/components/schemas/Money' } } } }
    PurchaseOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
