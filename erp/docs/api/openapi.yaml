            shipments: { type: array, items: { type: object, properties: { carrier: { type: string }, trackingNo: { type: string }, shippedAt: { type: string }, wooUpdateState: { type: string } } } }
            invoices: { type: array, items: { type: object, properties: { id: { type: string }, number: { type: string }, type: { type: string } } } }
            events: { type: array, items: { type: object, properties: { at: { type: string, format: date-time }, kind: { type: string }, fromStatus: { type: string }, toStatus: { type: string }, actor: { type: string } } } }
    ReturnInput:
      type: object
