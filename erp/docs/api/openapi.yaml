        lines: { type: array, items: { type: object, properties: { description: { type: string }, hsnCode: { type: string }, qty: { $ref: '#/components/schemas/Qty' }, unitPrice: { $ref: '#/components/schemas/Money' }, discount: { $ref: '#/components/schemas/Money' }, taxableValue: { $ref: '#/components/schemas/Money' }, gstRate: { type: string }, cgst: { $ref: '#/components/schemas/Money' }, sgst: { $ref: '#/components/schemas/Money' }, igst: { $ref: '#/components/schemas/Money' } } } }
        taxableTotal: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        roundOff: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
