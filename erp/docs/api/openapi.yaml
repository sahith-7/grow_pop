        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              variantId: { type: string, format: uuid }
              sku: { type: string }
              name: { type: string }
              orderedQty: { $ref: '#/components/schemas/Qty' }
