      description: |
        reasonCode damage|expiry|loss require stock.writeoff; correction|opening require stock.adjust.
        overrideNegative requires stock.override_negative and a note. 409 INSUFFICIENT_STOCK when the
        result would drop sellable stock below active reservations.
      x-permission: stock.adjust | stock.writeoff
      x-stage: B3
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdjustmentInput' } } } }
      responses:
        '201': { description: Posted, content: { application/json: { schema: { $ref: '#/components/schemas/PostedDocument' } } } }
        default: { $ref: '#/components/responses/Error' }
  /stock/transfers:
    post:
      operationId: postStockTransfers
