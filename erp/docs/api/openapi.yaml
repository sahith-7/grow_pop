        cartDiscountReason: { type: string }
    PricedCart:
      type: object
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              variantId: { type: string, format: uuid }
              name: { type: string }
              qty: { $ref: '#/components/schemas/Qty' }
              unitPrice: { $ref: '#/components/schemas/Money' }
              discount: { $ref: '#/components/schemas/Money' }
              taxableValue: { $ref: '#/components/schemas/Money' }
              gstRate: { type: string }
              tax: { $ref: '#/components/schemas/Money' }
              lineTotal: { $ref: '#/components/schemas/Money' }
              available: { $ref: '#/components/schemas/Qty' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discountTotal: { $ref: '#/components/schemas/Money' }
        taxBreakdown: { type: object, properties: { cgst: { $ref: '#/components/schemas/Money' }, sgst: { $ref: '#/components/schemas/Money' }, igst: { $ref: '#/components/schemas/Money' } } }
        roundOff: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    SaleResult:
      type: object
      properties:
        orderId: { type: string, format: uuid }
