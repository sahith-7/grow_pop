        attention: { type: object, properties: { stockExceptions: { type: integer }, readyToPick: { type: integer }, failedSyncJobs: { type: integer }, stocktakesInReview: { type: integer } } }
        recentSales: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
