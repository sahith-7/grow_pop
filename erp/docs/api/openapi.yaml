      summary: Transfer between internal locations, paired movements in one transaction (INV-06)
      x-permission: stock.transfer
      x-stage: B3
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransferInput' } } } }
      responses:
        '201': { description: Posted, content: { application/json: { schema: { $ref: '#/components/schemas/PostedDocument' } } } }
        default: { $ref: '#/components/responses/Error' }
