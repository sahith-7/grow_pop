      x-stage: B3
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counts]
              properties:
                counts:
                  type: array
                  maxItems: 500
                  items: { type: object, required: [variantId, countedQty], properties: { variantId: { type: string, format: uuid }, countedQty: { $ref: '#/components/schemas/Qty' } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Stocktake' } } } }
        default: { $ref: '#/components/responses/Error' }
  /stocktakes/{id}/submit:
    post:
      operationId: postStocktakesSubmit
      tags: [Stocktakes]
      summary: Move to review
      x-permission: stocktake.count
      x-stage: B3
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: In review, content: { application/json: { schema: { $ref: '#/components/schemas/Stocktake' } } } }
        default: { $ref: '#/components/responses/Error' }
  /stocktakes/{id}/post:
    post:
      operationId: postStocktakesPost
      tags: [Stocktakes]
      summary: Approve and post variances as stocktake movements (AC-06)
      x-permission: stocktake.approve
      x-stage: B3
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Posted, content: { application/json: { schema: { $ref: '#/components/schemas/Stocktake' } } } }
        default: { $ref: '#/components/responses/Error' }
  /stocktakes/{id}/cancel:
