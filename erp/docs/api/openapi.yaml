openapi: 3.1.0
info:
  title: Retail ERP API
  version: 0.2.0-design
  description: |
    Phase 2 contract for build stages B2–B6. Base path is /api/v1 as seen by the browser
    (the Next.js web app proxies /api/* to the API's /v1/*).

    Phase 1 routes (/auth, /users, /settings, /audit) are implemented and not repeated here,
    except where this design extends /settings.

    Conventions (see conventions.md): cookie session auth; tenant comes from the session only;
    money and quantities are decimal strings; cursor pagination; Idempotency-Key header on
    duplicate-prone writes; every error uses the Error envelope. `x-permission` names the
    permission the server checks; `x-stage` is the build stage that delivers the endpoint.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - { name: Files }
  - { name: Catalog }
  - { name: Imports & exports }
  - { name: Inventory }
  - { name: Stocktakes }
  - { name: Purchasing }
  - { name: POS & sales }
  - { name: Returns }
  - { name: Invoicing }
  - { name: Fulfilment }
  - { name: WooCommerce }
  - { name: Reports }
  - { name: Settings }

paths:
  # ---------------------------------------------------------------- Settings (extends Phase 1)
  /settings/tax:
    get:
      operationId: getSettingsTax
      tags: [Settings]
      summary: GST and stock policy settings
      x-permission: settings.manage
      x-stage: B5
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSettings' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: patchSettingsTax
      tags: [Settings]
      summary: Update GST and stock policy settings
      x-permission: settings.manage
      x-stage: B5
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSettings' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TaxSettings' } } } }
        default: { $ref: '#/components/responses/Error' }
  /settings/locations:
    get:
      operationId: getSettingsLocations
      tags: [Settings]
      summary: List inventory locations
      x-permission: stock.read
      x-stage: B3
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Location' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: postSettingsLocations
      tags: [Settings]
      summary: Create location
      x-permission: settings.manage
      x-stage: B3
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } } }
        default: { $ref: '#/components/responses/Error' }
  /settings/locations/{id}:
    patch:
      operationId: patchSettingsLocationsById
      tags: [Settings]
      summary: Rename, deactivate or change sellable flag (deactivate blocked while stock is non-zero)
      x-permission: settings.manage
      x-stage: B3
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } } }
        default: { $ref: '#/components/responses/Error' }
  /settings/invoice-series:
    get:
      operationId: getSettingsInvoiceSeries
      tags: [Settings]
      summary: List invoice and credit-note series
      x-permission: settings.manage
      x-stage: B5
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/InvoiceSeries' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: postSettingsInvoiceSeries
      tags: [Settings]
      summary: Create a series for a financial year (numbers cannot be edited once used)
      x-permission: settings.manage
      x-stage: B5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docType, financialYear, prefix]
              properties:
                docType: { type: string, enum: [invoice, credit_note] }
                financialYear: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-27' }
                prefix: { type: string, maxLength: 10, example: 'INV/26-27/' }
                startAt: { type: integer, minimum: 1, default: 1 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceSeries' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Dashboard
  /dashboard:
    get:
      operationId: getDashboard
      tags: [Reports]
      summary: Dashboard tiles; each tile is omitted when the user lacks its permission
      x-permission: (any signed-in user)
      x-stage: B6
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Files
  /files/uploads:
    post:
      operationId: postFilesUploads
      tags: [Files]
      summary: Get a presigned PUT URL for one file
      description: URL expires in 5 minutes and is bound to the declared size and content type. Max size per kind is a setting (default image 5 MB, import 10 MB).
      x-permission: product.write
      x-stage: B2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, contentType, byteSize]
              properties:
                kind: { type: string, enum: [product_image, import] }
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp, text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet] }
                byteSize: { type: integer, minimum: 1 }
                sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '201':
          description: Upload slot
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  headers: { type: object, additionalProperties: { type: string } }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /files/{id}/confirm:
    post:
      operationId: postFilesConfirm
      tags: [Files]
      summary: Confirm upload; server re-checks size, type and magic bytes before marking ready
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Ready or rejected, content: { application/json: { schema: { $ref: '#/components/schemas/File' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Catalog
  /categories:
    get:
      operationId: getCategories
      tags: [Catalog]
      summary: List categories
      x-permission: product.read
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/IncludeArchived' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RefItem' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: postCategories
      tags: [Catalog]
      summary: Create category
      x-permission: product.write
      x-stage: B2
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefItemInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RefItem' } } } }
        default: { $ref: '#/components/responses/Error' }
  /categories/{id}:
    patch:
      operationId: patchCategoriesById
      tags: [Catalog]
      summary: Rename or archive category
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefItemInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RefItem' } } } }
        default: { $ref: '#/components/responses/Error' }
  /brands:
    get:
      operationId: getBrands
      tags: [Catalog]
      summary: List brands
      x-permission: product.read
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/IncludeArchived' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/RefItem' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: postBrands
      tags: [Catalog]
      summary: Create brand
      x-permission: product.write
      x-stage: B2
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefItemInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RefItem' } } } }
        default: { $ref: '#/components/responses/Error' }
  /brands/{id}:
    patch:
      operationId: patchBrandsById
      tags: [Catalog]
      summary: Rename or archive brand
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefItemInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RefItem' } } } }
        default: { $ref: '#/components/responses/Error' }
  /units:
    get:
      operationId: getUnits
      tags: [Catalog]
      summary: List units
      x-permission: product.read
      x-stage: B2
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: postUnits
      tags: [Catalog]
      summary: Create unit
      x-permission: product.write
      x-stage: B2
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } } }
        default: { $ref: '#/components/responses/Error' }

  /products:
    get:
      operationId: getProducts
      tags: [Catalog]
      summary: Search products (CAT-01)
      x-permission: product.read
      x-stage: B2
      parameters:
        - { name: q, in: query, description: 'Name, SKU or barcode', schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, archived] } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: brandId, in: query, schema: { type: string, format: uuid } }
        - { name: publishState, in: query, schema: { $ref: '#/components/schemas/PublishState' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page of products (variant summary, primary image thumbnail, ATS)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: postProducts
      tags: [Catalog]
      summary: Create product with variants (CAT-01..04)
      description: Rejects duplicate SKU/barcode within the tenant with 409 SKU_DUPLICATE / BARCODE_DUPLICATE and fieldErrors pointing at the variant index.
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}:
    get:
      operationId: getProductsById
      tags: [Catalog]
      summary: Product detail with variants, images and publish state
      x-permission: product.read
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: patchProductsById
      tags: [Catalog]
      summary: Update product fields; optimistic concurrency via If-Match
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPatch' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}/archive:
    post:
      operationId: postProductsArchive
      tags: [Catalog]
      summary: Archive (history and open orders keep working; hidden from POS and search)
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Archived, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}/variants:
    post:
      operationId: postProductsVariants
      tags: [Catalog]
      summary: Add a variant
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VariantInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Variant' } } } }
        default: { $ref: '#/components/responses/Error' }
  /variants/{id}:
    patch:
      operationId: patchVariantsById
      tags: [Catalog]
      summary: Update variant (price, barcode and cost changes are audited; cost requires cost.view)
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VariantInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Variant' } } } }
        default: { $ref: '#/components/responses/Error' }
  /lookup:
    get:
      operationId: getLookup
      tags: [Catalog]
      summary: Resolve a scanned code to a variant (barcode, then SKU). Used by POS, receiving, stocktake, picking.
      x-permission: product.read
      x-stage: B2
      parameters:
        - { name: code, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: locationId, in: query, description: 'Include availability at this location', schema: { type: string, format: uuid } }
      responses:
        '200': { description: Found, content: { application/json: { schema: { $ref: '#/components/schemas/LookupResult' } } } }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}/images:
    post:
      operationId: postProductsImages
      tags: [Catalog]
      summary: Attach an uploaded file as product image (CAT-05/06)
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId: { type: string, format: uuid }
                variantId: { type: [string, 'null'], format: uuid }
                altText: { type: string, maxLength: 200 }
                isPrimary: { type: boolean }
      responses:
        '201': { description: Attached, content: { application/json: { schema: { $ref: '#/components/schemas/Image' } } } }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}/images/order:
    put:
      operationId: putProductsImagesOrder
      tags: [Catalog]
      summary: Set image order and primary in one call
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageIds, primaryImageId]
              properties:
                imageIds: { type: array, items: { type: string, format: uuid } }
                primaryImageId: { type: string, format: uuid }
      responses:
        '200': { description: Reordered, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Image' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}/images/{imageId}:
    patch:
      operationId: patchProductsImagesById
      tags: [Catalog]
      summary: Replace file or change alt text
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }, { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { fileId: { type: string, format: uuid }, altText: { type: string } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Image' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteProductsImagesById
      tags: [Catalog]
      summary: Remove image (also queues removal from Woo)
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }, { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Error' }
  /barcodes/generate:
    post:
      operationId: postBarcodesGenerate
      tags: [Catalog]
      summary: Reserve N internal EAN-13 barcodes (prefix + sequence + check digit)
      x-permission: product.write
      x-stage: B2
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [count], properties: { count: { type: integer, minimum: 1, maximum: 500 } } } } }
      responses:
        '200': { description: Codes, content: { application/json: { schema: { type: object, properties: { codes: { type: array, items: { type: string, pattern: '^\d{13}$' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /labels:
    post:
      operationId: postLabels
      tags: [Catalog]
      summary: Build label print data (browser renders and prints)
      x-permission: product.read
      x-stage: B2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, template]
              properties:
                template: { type: string, enum: ['50x25', '38x25', 'a4-65'] }
                showPrice: { type: boolean, default: true }
                items:
                  type: array
                  maxItems: 500
                  items: { type: object, required: [variantId, copies], properties: { variantId: { type: string, format: uuid }, copies: { type: integer, minimum: 1, maximum: 200 } } }
      responses:
        '200':
          description: Label rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels: { type: array, items: { type: object, properties: { barcode: { type: string }, sku: { type: string }, name: { type: string }, price: { $ref: '#/components/schemas/Money' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Imports / exports
  /imports:
    post:
      operationId: postImports
      tags: [Imports & exports]
      summary: Start a CSV/XLSX import; validates only, writes nothing (CAT-10)
      x-permission: product.write
      x-stage: B2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, fileId, mapping]
              properties:
                kind: { type: string, enum: [products, opening_stock] }
                fileId: { type: string, format: uuid }
                mapping: { type: object, additionalProperties: { type: string }, description: 'target field -> source column header' }
                locationId: { type: string, format: uuid, description: 'Required for opening_stock' }
      responses:
        '202': { description: Validation queued, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }
        default: { $ref: '#/components/responses/Error' }
  /imports/{id}:
    get:
      operationId: getImportsById
      tags: [Imports & exports]
      summary: Import status with first 50 error rows for preview
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }
        default: { $ref: '#/components/responses/Error' }
  /imports/{id}/commit:
    post:
      operationId: postImportsCommit
      tags: [Imports & exports]
      summary: Import the valid rows (only from status validated)
      x-permission: product.write
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '202': { description: Import queued, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }
        default: { $ref: '#/components/responses/Error' }
  /exports:
    post:
      operationId: postExports
      tags: [Imports & exports]
      summary: Queue a CSV export (CAT-11); cost columns only with cost.view
      x-permission: report.export
      x-stage: B2
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [products, stock, movements, sales, purchasing] }, filters: { type: object } } } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        default: { $ref: '#/components/responses/Error' }
  /exports/{id}:
    get:
      operationId: getExportsById
      tags: [Imports & exports]
      summary: Export status; downloadUrl is a 5-minute signed URL when done
      x-permission: report.export
      x-stage: B2
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExportJob' } } } }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Inventory
  /stock/balances:
    get:
      operationId: getStockBalances
      tags: [Inventory]
      summary: On-hand, reserved, available, non-sellable per variant and location (INV-01/02)
      x-permission: stock.read
      x-stage: B3
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: locationId, in: query, schema: { type: string, format: uuid } }
        - { name: lowStock, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/StockBalance' } } } }
        default: { $ref: '#/components/responses/Error' }
  /stock/movements:
    get:
      operationId: getStockMovements
      tags: [Inventory]
      summary: Ledger history (INV-03/09)
      x-permission: stock.read
      x-stage: B3
      parameters:
        - { name: variantId, in: query, schema: { type: string, format: uuid } }
        - { name: locationId, in: query, schema: { type: string, format: uuid } }
        - { name: movementType, in: query, schema: { $ref: '#/components/schemas/MovementType' } }
