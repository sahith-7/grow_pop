              poLineId: { type: [string, 'null'], format: uuid }
              variantId: { type: string, format: uuid }
              locationId: { type: string, format: uuid }
              receivedQty: { $ref: '#/components/schemas/Qty' }
              acceptedQty: { $ref: '#/components/schemas/Qty' }
              damagedQty: { $ref: '#/components/schemas/Qty' }
              unitCost: { $ref: '#/components/schemas/Money' }
    PosCart:
      type: object
      required: [lines]
      properties:
        customerId: { type: [string, 'null'], format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [variantId, qty]
            properties:
              variantId: { type: string, format: uuid }
              qty: { $ref: '#/components/schemas/Qty' }
