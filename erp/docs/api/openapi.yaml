              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  variantId: { type: [string, 'null'], format: uuid }
                  sku: { type: string }
                  name: { type: string }
                  qty: { $ref: '#/components/schemas/Qty' }
