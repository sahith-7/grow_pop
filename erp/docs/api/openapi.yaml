      x-permission: stocktake.count
      x-stage: B3
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Stocktake' } } } }
        default: { $ref: '#/components/responses/Error' }
  /stocktakes/{id}/counts:
    put:
      operationId: putStocktakesCounts
