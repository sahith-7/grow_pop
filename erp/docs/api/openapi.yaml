        total: { $ref: '#/components/schemas/Money' }
        change: { $ref: '#/components/schemas/Money' }
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 120 }
        phone: { type: string, pattern: '^\+?[0-9]{8,15}$' }
