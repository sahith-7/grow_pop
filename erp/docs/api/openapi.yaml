  # ---------------------------------------------------------------- POS & sales
  /pos/quote:
    post:
      operationId: postPosQuote
      tags: [POS & sales]
      summary: Price a cart (server computes tax and totals; nothing is stored)
      x-permission: pos.sell
      x-stage: B5
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PosCart' } } } }
      responses:
        '200': { description: Priced cart, content: { application/json: { schema: { $ref: '#/components/schemas/PricedCart' } } } }
        default: { $ref: '#/components/responses/Error' }
  /pos/sales:
    post:
      operationId: postPosSales
      tags: [POS & sales]
      summary: Complete a POS sale atomically (stock, invoice, payments, Woo stock job)
      description: |
        Idempotency-Key is required; resending the same key returns the original sale (200) instead of
        creating another. Discounts beyond the user's limit → 403 DISCOUNT_LIMIT. Price override needs
        pos.price_override. Payments must sum to the server-computed total.
      x-permission: pos.sell
      x-stage: B5
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PosCart'
                - type: object
                  required: [payments, expectedTotal]
                  properties:
                    expectedTotal: { $ref: '#/components/schemas/Money', description: 'Total the cashier saw; 409 PRICE_CHANGED if the server total differs' }
                    payments:
                      type: array
                      minItems: 1
                      items: { type: object, required: [method, amount], properties: { method: { type: string, enum: [cash, card, upi, other] }, amount: { $ref: '#/components/schemas/Money' }, reference: { type: string, maxLength: 100 } } }
      responses:
        '201': { description: Sale completed, content: { application/json: { schema: { $ref: '#/components/schemas/SaleResult' } } } }
        '200': { description: Replay of an earlier request with the same key, content: { application/json: { schema: { $ref: '#/components/schemas/SaleResult' } } } }
        default: { $ref: '#/components/responses/Error' }
