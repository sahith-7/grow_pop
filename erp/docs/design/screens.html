<title>TRIDENT Screen Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ==========================================================================
   Retail ERP design tokens (Phase 2 visual language, direction A "Ledger")
   The ONLY file that holds raw colour, font and size values.
   Components and screens use var(--token) and never literals.
   Rebrand = edit this file (and brand.ts). Contrast ratios in comments are
   against --surface (#fff) unless noted; all meet WCAG 2.2 AA.
   ========================================================================== */

:root {
  /* ---- Brand ---------------------------------------------------------- */
  --brand-ink:        #2F45B8;  /* primary actions, links, selection     7.9:1 */
  --brand-ink-hover:  #24379A;  /*                                       10.1:1 */
  --brand-ink-soft:   #ECEFFB;  /* selected row, active nav background         */
  --brand-marigold:   #E8A317;  /* logo mark + scan-ready pulse ONLY, never text on white */

  /* ---- Neutrals (cool, biased toward the brand blue) ------------------ */
  --bg:               #F6F7F9;  /* app background                               */
  --surface:          #FFFFFF;  /* panels, tables, inputs                       */
  --surface-sunken:   #EEF0F4;  /* table header, read-only fields, code         */
  --border:           #DDE1E8;  /* dividers, panel outlines (decorative)        */
  --border-control:   #8A93A3;  /* input/checkbox outlines                3.1:1 */
  --text:             #161B26;  /* body                          16.1:1 on --bg */
  --text-2:           #4A5363;  /* secondary                                7.8:1 */
  --text-3:           #626B7D;  /* captions, placeholders                   5.4:1 */
  --text-on-brand:    #FFFFFF;

  /* ---- Status (never the only signal: always paired with text/icon) --- */
  --success:          #13723A;  --success-soft: #E8F5EC;   /* 6.0 / 5.4 on soft */
  --warning:          #8A5300;  --warning-soft: #FDF3E1;   /* 6.3 / 5.8 */
  --danger:           #B42318;  --danger-soft:  #FDECEA;   /* 6.6 / 5.8 */
  --info:             #0B6690;  --info-soft:    #E6F3F9;   /* 6.3 / 5.6 */
  --neutral-badge:    #4A5363;  --neutral-soft: #EEF0F4;

  /* ---- Typography ------------------------------------------------------ */
  /* IBM Plex: true tabular figures, a Devanagari sibling for Hindi later,
     open licence. Self-host the woff2 files in production (no third-party
     font CDN: CSP + privacy + offline-tolerant counters).                  */
  --font-sans: 'IBM Plex Sans', 'IBM Plex Sans Devanagari', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* scale (px): 12 13 14 16 18 20 24 30 */
  --text-xs: 0.75rem;   --lh-xs: 1rem;      /* captions, badges           */
  --text-sm: 0.8125rem; --lh-sm: 1.125rem;  /* table cells, helper text   */
  --text-md: 0.875rem;  --lh-md: 1.25rem;   /* body, inputs (default)     */
  --text-lg: 1rem;      --lh-lg: 1.5rem;    /* section titles, POS lines  */
  --text-xl: 1.125rem;  --lh-xl: 1.5rem;    /* panel titles               */
  --text-2xl: 1.25rem;  --lh-2xl: 1.75rem;  /* page titles                */
  --text-3xl: 1.5rem;   --lh-3xl: 2rem;     /* KPI values                 */
  --text-4xl: 1.875rem; --lh-4xl: 2.25rem;  /* POS total                  */
  --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600;

  /* ---- Spacing (4 px base) --------------------------------------------- */
  --space-0: 0;     --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px;  --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --space-10: 40px; --space-12: 48px;

  /* ---- Sizing ----------------------------------------------------------- */
  --control-h-sm: 32px;   /* dense toolbars                                 */
  --control-h:    36px;   /* default buttons/inputs (desktop)               */
  --control-h-lg: 48px;   /* POS, pick screens, touch (>= 44px target)      */
  --row-h:        40px;   /* table row, compact                             */
  --row-h-touch:  52px;   /* table row on counter screens                   */
  --sidebar-w:    232px;  --sidebar-w-collapsed: 64px;  --topbar-h: 56px;
  --content-max:  1440px;

  /* ---- Shape & depth ---------------------------------------------------- */
  --radius-sm: 4px;   /* inputs, badges, buttons */
  --radius-md: 8px;   /* panels, dialogs         */
  --radius-pill: 999px;
  --shadow-overlay: 0 8px 24px rgba(22, 27, 38, .16), 0 2px 6px rgba(22, 27, 38, .08); /* menus, dialogs, toasts only */
  --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand-ink);

  /* ---- Motion ----------------------------------------------------------- */
  --ease: cubic-bezier(.2, 0, 0, 1);
  --dur-fast: 120ms;  --dur: 200ms;

  /* ---- Layers ----------------------------------------------------------- */
  --z-sticky: 10; --z-drawer: 40; --z-overlay: 50; --z-toast: 60;

  color-scheme: light;
}

/* Dark theme: defined so the tokens are proven theme-safe; NOT enabled in V1.
   Opt-in by setting data-theme="dark" on <html> once every screen is checked. */
:root[data-theme="dark"] {
  --brand-ink: #8EA0FF;  --brand-ink-hover: #A9B7FF;  --brand-ink-soft: #232B4D;
  --bg: #12151C;  --surface: #1A1E27;  --surface-sunken: #222733;
  --border: #2E3442;  --border-control: #6B7385;
  --text: #E7EAF0;  --text-2: #A9B1C0;  --text-3: #8C94A5;  --text-on-brand: #12151C;
  --success: #5CC98A; --success-soft: #16301F;
  --warning: #F0B455; --warning-soft: #33270F;
  --danger:  #FF8A80; --danger-soft:  #3A1A18;
  --info:    #6CC3EC; --info-soft:    #10293A;
  --neutral-badge: #A9B1C0; --neutral-soft: #222733;
  --shadow-overlay: 0 8px 24px rgba(0,0,0,.5);
  color-scheme: dark;
}

@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 0ms; --dur: 0ms; }
}

/* ==========================================================================
   Retail ERP components (Phase 2, visual language). Depends on tokens.css.
   Framework-agnostic: React components in apps/web render these class names.
   All classes are prefixed ui- so they cannot collide with Phase 1 styles.
   ========================================================================== */

/* ---- Base --------------------------------------------------------------- */
.ui-root, .ui-root * { box-sizing: border-box; }
.ui-root {
  font-family: var(--font-sans); font-size: var(--text-md); line-height: var(--lh-md);
  color: var(--text); background: var(--bg);
  font-feature-settings: 'tnum' 0; -webkit-font-smoothing: antialiased;
}
.ui-root :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
.ui-num, .ui-money, .ui-qty { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ui-code { font-family: var(--font-mono); font-size: var(--text-sm); letter-spacing: 0; }
.ui-muted { color: var(--text-2); }
.ui-caption { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--text-3); }
.ui-sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ui-h1 { font-size: var(--text-2xl); line-height: var(--lh-2xl); font-weight: var(--weight-semibold); margin: 0; text-wrap: balance; }
.ui-h2 { font-size: var(--text-xl); line-height: var(--lh-xl); font-weight: var(--weight-semibold); margin: 0; }
.ui-h3 { font-size: var(--text-lg); line-height: var(--lh-lg); font-weight: var(--weight-semibold); margin: 0; }
.ui-eyebrow { font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: var(--weight-semibold); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }

/* ---- App shell ---------------------------------------------------------- */
.ui-shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100%; }
.ui-sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: var(--space-5); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.ui-brand { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); font-weight: var(--weight-semibold); font-size: var(--text-lg); }
.ui-nav-group { display: flex; flex-direction: column; gap: 2px; }
.ui-nav-group > .ui-eyebrow { padding: 0 var(--space-2) var(--space-1); }
.ui-nav-link { display: flex; align-items: center; gap: var(--space-2); min-height: var(--control-h-sm); padding: 0 var(--space-2); border-radius: var(--radius-sm); color: var(--text); text-decoration: none; font-size: var(--text-md); }
.ui-nav-link:hover { background: var(--surface-sunken); }
.ui-nav-link[aria-current="page"] { background: var(--brand-ink-soft); color: var(--brand-ink); font-weight: var(--weight-semibold); }
.ui-nav-link .ui-count { margin-left: auto; }
.ui-topbar { height: var(--topbar-h); display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-6); border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: var(--z-sticky); }
.ui-main { min-width: 0; display: flex; flex-direction: column; }
.ui-content { width: 100%; max-width: var(--content-max); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
.ui-page-header { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.ui-page-header .ui-actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: var(--space-2); }
.ui-shell--focus { grid-template-columns: minmax(0, 1fr); }      /* POS, pick: no sidebar */
.ui-shell--focus .ui-sidebar { display: none; }

/* ---- Buttons ------------------------------------------------------------ */
.ui-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-h); padding: 0 var(--space-4); border-radius: var(--radius-sm); border: 1px solid var(--border-control); background: var(--surface); color: var(--text); font: inherit; font-weight: var(--weight-medium); white-space: nowrap; cursor: pointer; transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.ui-btn:hover { background: var(--surface-sunken); }
.ui-btn--primary { background: var(--brand-ink); border-color: var(--brand-ink); color: var(--text-on-brand); }
.ui-btn--primary:hover { background: var(--brand-ink-hover); border-color: var(--brand-ink-hover); }
.ui-btn--danger { background: var(--surface); border-color: var(--danger); color: var(--danger); }
.ui-btn--danger:hover { background: var(--danger-soft); }
.ui-btn--ghost { border-color: transparent; background: transparent; color: var(--brand-ink); }
.ui-btn--ghost:hover { background: var(--brand-ink-soft); }
.ui-btn--sm { height: var(--control-h-sm); padding: 0 var(--space-3); font-size: var(--text-sm); }
.ui-btn--lg { height: var(--control-h-lg); padding: 0 var(--space-5); font-size: var(--text-lg); }
.ui-btn--block { width: 100%; }
.ui-btn--icon { width: var(--control-h); padding: 0; }
.ui-btn[disabled], .ui-btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.ui-btn[aria-busy="true"] { position: relative; color: transparent; pointer-events: none; }
.ui-btn[aria-busy="true"]::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-color: var(--text-3) transparent var(--text-3) var(--text-3); animation: ui-spin .7s linear infinite; }
.ui-btn--primary[aria-busy="true"]::after { border-color: var(--text-on-brand) transparent var(--text-on-brand) var(--text-on-brand); }
@keyframes ui-spin { to { transform: rotate(360deg); } }

/* ---- Form fields -------------------------------------------------------- */
.ui-field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.ui-label { font-size: var(--text-sm); line-height: var(--lh-sm); font-weight: var(--weight-medium); color: var(--text); }
.ui-label .ui-req { color: var(--danger); margin-left: 2px; }
.ui-help { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--text-3); }
.ui-error { font-size: var(--text-xs); line-height: var(--lh-xs); color: var(--danger); display: flex; gap: var(--space-1); }
.ui-input, .ui-select, .ui-textarea { width: 100%; height: var(--control-h); padding: 0 var(--space-3); border: 1px solid var(--border-control); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font: inherit; }
.ui-textarea { height: auto; min-height: 88px; padding: var(--space-2) var(--space-3); resize: vertical; }
.ui-input::placeholder { color: var(--text-3); }
.ui-input[aria-invalid="true"], .ui-select[aria-invalid="true"] { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.ui-input[readonly] { background: var(--surface-sunken); }
.ui-input--num { text-align: right; font-variant-numeric: tabular-nums; }
.ui-input-group { display: flex; align-items: stretch; }
.ui-input-group > .ui-addon { display: flex; align-items: center; padding: 0 var(--space-3); border: 1px solid var(--border-control); background: var(--surface-sunken); color: var(--text-2); }
.ui-input-group > .ui-addon:first-child { border-right: 0; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.ui-input-group > .ui-addon:last-child { border-left: 0; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.ui-input-group > .ui-input { border-radius: 0; }
.ui-input-group > .ui-input:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.ui-input-group > .ui-input:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.ui-check { display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--control-h-sm); cursor: pointer; }
.ui-check input { width: 16px; height: 16px; accent-color: var(--brand-ink); margin: 0; }
.ui-form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-4); }
.ui-form-grid .ui-span-all { grid-column: 1 / -1; }
.ui-form-footer { display: flex; justify-content: flex-end; gap: var(--space-2); padding-top: var(--space-4); border-top: 1px solid var(--border); }

/* Qty stepper (POS, receiving) */
.ui-stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-control); border-radius: var(--radius-sm); overflow: hidden; }
.ui-stepper button { width: var(--control-h); height: var(--control-h); border: 0; background: var(--surface-sunken); color: var(--text); font: inherit; font-size: var(--text-lg); cursor: pointer; }
.ui-stepper input { width: 56px; height: var(--control-h); border: 0; text-align: center; font: inherit; font-variant-numeric: tabular-nums; background: var(--surface); color: var(--text); }

/* Scan field: always-focused capture for keyboard-wedge scanners */
.ui-scan { display: flex; align-items: center; gap: var(--space-3); height: var(--control-h-lg); padding: 0 var(--space-4); border: 2px solid var(--brand-ink); border-radius: var(--radius-md); background: var(--surface); }
.ui-scan input { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: var(--text-lg); background: transparent; color: var(--text); }
.ui-scan .ui-scan-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand-marigold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-marigold) 30%, transparent); }
.ui-scan[data-state="ok"] { border-color: var(--success); }
.ui-scan[data-state="error"] { border-color: var(--danger); animation: ui-shake var(--dur) var(--ease); }
@keyframes ui-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* ---- Badges & status ---------------------------------------------------- */
.ui-badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 22px; padding: 0 var(--space-2); border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--weight-semibold); white-space: nowrap; background: var(--neutral-soft); color: var(--neutral-badge); }
.ui-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ui-badge--success { background: var(--success-soft); color: var(--success); }
.ui-badge--warning { background: var(--warning-soft); color: var(--warning); }
.ui-badge--danger  { background: var(--danger-soft);  color: var(--danger); }
.ui-badge--info    { background: var(--info-soft);    color: var(--info); }
.ui-badge--brand   { background: var(--brand-ink-soft); color: var(--brand-ink); }
.ui-count { display: inline-flex; min-width: 20px; height: 20px; padding: 0 6px; align-items: center; justify-content: center; border-radius: var(--radius-pill); background: var(--danger); color: var(--text-on-brand); font-size: var(--text-xs); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }

/* ---- Alerts, toasts ----------------------------------------------------- */
.ui-alert { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 1px solid; background: var(--surface); }
.ui-alert > :first-child { flex-shrink: 0; font-weight: var(--weight-semibold); }
.ui-alert .ui-alert-body { flex: 1; min-width: 0; color: var(--text); }
.ui-alert .ui-actions { display: flex; gap: var(--space-2); flex-shrink: 0; }
.ui-alert--info    { border-color: var(--info);    background: var(--info-soft); }
.ui-alert--success { border-color: var(--success); background: var(--success-soft); }
.ui-alert--warning { border-color: var(--warning); background: var(--warning-soft); }
.ui-alert--danger  { border-color: var(--danger);  background: var(--danger-soft); }
.ui-alert--info > :first-child { color: var(--info); } .ui-alert--success > :first-child { color: var(--success); }
.ui-alert--warning > :first-child { color: var(--warning); } .ui-alert--danger > :first-child { color: var(--danger); }
.ui-toast-region { position: fixed; right: var(--space-6); bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--space-2); z-index: var(--z-toast); }
.ui-toast { min-width: 280px; max-width: 420px; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--text); color: var(--surface); box-shadow: var(--shadow-overlay); display: flex; gap: var(--space-3); align-items: center; }
.ui-toast a, .ui-toast button { color: inherit; font-weight: var(--weight-semibold); background: none; border: 0; font: inherit; text-decoration: underline; cursor: pointer; }

/* ---- Panels, KPI tiles -------------------------------------------------- */
.ui-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); min-width: 0; }
.ui-panel-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.ui-panel-head .ui-actions { margin-left: auto; display: flex; gap: var(--space-2); }
.ui-panel-body { padding: var(--space-4); }
.ui-kpi { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); }
.ui-kpi-value { font-size: var(--text-3xl); line-height: var(--lh-3xl); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
.ui-kpi-delta { font-size: var(--text-xs); font-weight: var(--weight-medium); }
.ui-kpi-delta[data-dir="up"] { color: var(--success); } .ui-kpi-delta[data-dir="down"] { color: var(--danger); }
.ui-list-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.ui-list-row:last-child { border-bottom: 0; }
.ui-list-row > :last-child { margin-left: auto; }

/* ---- Tables ------------------------------------------------------------- */
.ui-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ui-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--text-sm); line-height: var(--lh-sm); }
.ui-table th { position: sticky; top: 0; z-index: 1; background: var(--surface-sunken); color: var(--text-2); font-weight: var(--weight-semibold); text-align: left; font-size: var(--text-xs); letter-spacing: .02em; padding: 0 var(--space-3); height: 36px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.ui-table td { padding: 0 var(--space-3); height: var(--row-h); border-bottom: 1px solid var(--border); vertical-align: middle; }
.ui-table td.ui-wrap { white-space: normal; padding-block: var(--space-2); }
.ui-table .ui-num, .ui-table .ui-money, .ui-table .ui-qty { text-align: right; }
.ui-table th[aria-sort] button { all: unset; cursor: pointer; display: inline-flex; gap: var(--space-1); }
.ui-table tbody tr:hover td { background: var(--bg); }
.ui-table tbody tr[aria-selected="true"] td { background: var(--brand-ink-soft); }
.ui-table tr[data-tone="danger"] td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
.ui-table tr[data-tone="warning"] td:first-child { box-shadow: inset 3px 0 0 var(--warning); }
.ui-table--touch td { height: var(--row-h-touch); font-size: var(--text-md); }
.ui-table .ui-cell-title { font-weight: var(--weight-medium); color: var(--text); }
.ui-table .ui-cell-sub { font-size: var(--text-xs); color: var(--text-3); }
.ui-thumb { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--surface-sunken); object-fit: cover; flex-shrink: 0; }

/* Toolbar above tables: search, filter chips, bulk actions */
.ui-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.ui-toolbar .ui-search { flex: 1 1 280px; max-width: 420px; }
.ui-chip { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--control-h-sm); padding: 0 var(--space-3); border: 1px dashed var(--border-control); border-radius: var(--radius-pill); background: var(--surface); color: var(--text-2); font: inherit; font-size: var(--text-sm); cursor: pointer; }
.ui-chip[aria-pressed="true"] { border-style: solid; border-color: var(--brand-ink); background: var(--brand-ink-soft); color: var(--brand-ink); }
.ui-bulkbar { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-4); background: var(--brand-ink-soft); color: var(--brand-ink); font-weight: var(--weight-medium); }
.ui-pager { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: var(--text-2); }

.ui-tabs { display: flex; gap: var(--space-4); border-bottom: 1px solid var(--border); overflow-x: auto; }

    else f.innerHTML='<div class="ui-shell'+(t.dataset.focus?' ui-shell--focus':'')+'">'+side(t.dataset.nav)+'<main class="ui-main">'+(t.dataset.focus?'':top)+inner+'</main></div>';
    stage.appendChild(f);frames[t.dataset.id]=f;
    var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=t.dataset.label;b.dataset.id=t.dataset.id;b.onclick=function(){show(t.dataset.id);try{history.replaceState(null,'','#'+t.dataset.id)}catch(e){}};picker.appendChild(b);
  });
  function show(id){
    Object.keys(frames).forEach(function(k){frames[k].hidden=k!==id});
    [].forEach.call(picker.children,function(b){b.setAttribute('aria-selected',b.dataset.id===id)});
    var t=tpls.filter(function(x){return x.dataset.id===id})[0];why.innerHTML=t.dataset.why;
    try{localStorage.setItem('tz-screen',id)}catch(e){}
  }
  var start=location.hash.slice(1);if(!frames[start]){try{start=localStorage.getItem('tz-screen')}catch(e){start=null}}
  show(frames[start]?start:'dashboard');
  if(window.lucide) lucide.createIcons({attrs:{'aria-hidden':'true'}});
  stage.addEventListener('click',function(e){
    var tab=e.target.closest('.ui-tab');if(tab){tab.parentNode.querySelectorAll('.ui-tab').forEach(function(x){x.setAttribute('aria-selected',x===tab)})}
    var seg=e.target.closest('.ui-segmented button');if(seg){seg.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===seg)})}
    var chip=e.target.closest('.ui-chip');if(chip){chip.setAttribute('aria-pressed',chip.getAttribute('aria-pressed')!=='true')}
    if(e.target.closest('a[href="#"]'))e.preventDefault();
  });
})();
</script>
