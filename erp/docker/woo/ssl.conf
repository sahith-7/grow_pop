# DEV ONLY: https for the local WooCommerce shop (WooCommerce accepts API keys only over https).
<VirtualHost *:443>
  DocumentRoot /var/www/html
  SSLEngine on
  SSLCertificateFile /certs/woo.crt
  SSLCertificateKeyFile /certs/woo.key
  <Directory /var/www/html>
    AllowOverride All
  </Directory>
</VirtualHost>
