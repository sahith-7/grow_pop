# Local/staging stack. Copy .env.example to .env and set real secrets first.
# Project name "trident": containers are trident-api-1 etc. and the database lives in the volume trident_pgdata, so
# TRIDENT never picks up an older erp_pgdata volume by accident.
name: trident
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/migrate.js"]
    env_file: .env   # B7: the console-account script (dist/scripts/platform-admin.js) needs WOO_ENC_KEY
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/erp
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://erp_app:${APP_DB_PASSWORD}@db:5432/erp
      # B7 (D76): trust exactly one hop, `web`. web's /api proxy passes X-Forwarded-For through unchanged, so the
      # address the api sees is the last one Cloudflare appended: correct only while the origin is reachable through
      # Cloudflare alone (docs/runbooks/production-setup.md). 'true' would take the first, client-written address.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # B2: background jobs (CSV imports now; WooCommerce sync from B4). Same image as api, different entrypoint.
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://erp_app:${APP_DB_PASSWORD}@db:5432/erp
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck: { disable: true }   # the image's healthcheck probes :4000, which only the api serves

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { API_URL: "http://api:4000" } }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]

volumes:
  pgdata:
